name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 06:00 UTC, so the public sites are checked even when nothing was pushed.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  typecheck:
    name: Typecheck and BDD generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bddgen
      - run: npm run typecheck

  api:
    name: API (Playwright + Newman)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright API tests
        run: npx playwright test --project=api
      - name: Postman collections (Newman)
        run: npm run test:postman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report
          retention-days: 7

  ui:
    name: UI (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile, bdd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project == 'bdd' && 'chromium' || matrix.project }}
      - name: Health check of the systems under test
        run: |
          curl -fsS -o /dev/null https://www.saucedemo.com/
          curl -fsS -o /dev/null https://heloisatorres1.github.io/qa-workspace/
      - name: Generate BDD tests from the feature files
        run: npm run bddgen
      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-${{ matrix.project }}
          path: allure-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-${{ matrix.project }}
          path: test-results
          retention-days: 7

  report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true
      - name: Generate the Allure report
        run: npm run report:allure
      - name: Assemble the site (project page at /, Allure report at /report/)
        run: |
          mkdir -p public
          cp -r site/. public/
          mv allure-report public/report
      - uses: actions/download-artifact@v4
        continue-on-error: true   # the API job may have stopped before Newman ran
        with:
          name: newman-report
          path: public/newman
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
